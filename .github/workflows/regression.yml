
name: Parking Regression Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show committed parking logic
        run: cat parking.py

      - name: Run regression tests
        run: python -m unittest -v
